# Every 10 minutes: checks that the live site's database matches the code, and
# retries failed merchant webhooks. Vercel's free plan only allows a daily
# cron, so GitHub's scheduler runs these instead. GitHub emails the repository
# owner when a job fails.
# The retry job needs the repository secret CRON_SECRET (the same value as in
# Vercel); until it is set, that job is skipped.
name: Webhook retries and health check

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the live database matches the code
        run: |
          curl --fail-with-body --silent --show-error --max-time 30 \
            https://www.toropay.co.in/api/health

  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Call the retry endpoint
        if: ${{ env.CRON_SECRET != '' }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://www.toropay.co.in/api/cron/webhook-retries
