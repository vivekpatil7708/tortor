# Retries failed merchant webhooks every 10 minutes. Vercel's free plan only
# allows a daily cron, so GitHub's scheduler calls the endpoint instead.
# Needs the repository secret CRON_SECRET (the same value as in Vercel);
# until it is set, the run is skipped.
name: Retry failed webhooks

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Call the retry endpoint
        if: ${{ env.CRON_SECRET != '' }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://www.toropay.co.in/api/cron/webhook-retries
