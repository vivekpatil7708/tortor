# Runs the type check, all tests and a production build on every push and pull
# request, so a broken change shows up before anyone relies on the deploy.
# GitHub emails the repository owner when it fails. Production's database is
# never touched: the build gets a placeholder DATABASE_URL, and the database
# tests get their own throwaway Postgres inside the run.
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production build
        run: npx next build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:1/placeholder
          NEXT_TELEMETRY_DISABLED: 1

  # Payment flows, races and webhooks against a real Postgres, built from
  # prisma/schema.prisma and filled with made-up data (tests/db, docs/qa-plan.md).
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: toropay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d toropay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - name: Database tests
        run: npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/toropay_test
